<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #B8922A;
  --gold-light: #E8C96A;
  --cw: 230px;
  --ch: 360px;
  --gap: 24px;
}
html, body { height: 100%; overflow: hidden; background: #070D1A; color: #fff; font-family: 'DM Sans', sans-serif; }
.page {
  height: 100vh; display: flex; flex-direction: column;
  background:
    radial-gradient(ellipse 80% 40% at 50% -10%, rgba(232,201,106,.13) 0%, transparent 60%),
    linear-gradient(180deg, #0D1F3C 0%, #070D1A 50%, #040810 100%);
}

/* TOPBAR */
.topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 5%; flex-shrink:0; border-bottom:1px solid rgba(232,201,106,.1); }
.logo-link { display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff; }
.logo-link img { height:44px; }
.logo-label { font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold-light); }
.back-link { font-size:13px; color:rgba(255,255,255,.55); text-decoration:none; display:flex; align-items:center; gap:6px; transition:color .2s; }
.back-link:hover { color:var(--gold-light); }

/* HERO */
.hero { text-align:center; padding:16px 5% 10px; flex-shrink:0; }
.kicker { font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold-light); margin-bottom:6px; }
.hero h1 {
  font-family:'Playfair Display',serif; font-size:clamp(26px,3.5vw,46px); line-height:1.1; margin-bottom:6px;
  background:linear-gradient(135deg,#fff 30%,var(--gold-light));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.hero p { font-size:13px; color:rgba(255,255,255,.52); max-width:500px; margin:0 auto; line-height:1.55; }

/* STAGE */
.stage { flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:0; overflow:hidden; }
.stage::before {
  content:''; position:absolute; inset:0; z-index:5; pointer-events:none;
  background:linear-gradient(90deg, rgba(4,8,16,.85) 0%, transparent 14%, transparent 86%, rgba(4,8,16,.85) 100%);
}
.spotlight { position:absolute; top:-20%; left:50%; transform:translateX(-50%); width:500px; height:500px; background:radial-gradient(circle, rgba(232,201,106,.09) 0%, transparent 65%); pointer-events:none; z-index:0; }

/* CANVAS — our custom physics scroll lives here */
.carousel-wrap { position:relative; z-index:2; width:100%; height:calc(var(--ch) + 70px); overflow:hidden; touch-action:pan-y; }
.carousel-belt {
  display:flex; align-items:center; gap:var(--gap);
  position:absolute; top:50%;
  will-change:transform; user-select:none;
  /* left offset set by JS */
}

/* ARROWS */
.arrow { position:absolute; top:50%; z-index:10; width:44px; height:64px; background:rgba(13,31,60,.7); border:1px solid rgba(232,201,106,.28); border-radius:6px; color:rgba(255,255,255,.7); font-size:28px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s,color .2s,border-color .2s; backdrop-filter:blur(4px); }
.arrow:hover { background:rgba(184,146,42,.25); border-color:var(--gold-light); color:var(--gold-light); }
.arrow-left { left:10px; }
.arrow-right { right:10px; }

/* CARD */
.card { flex-shrink:0; width:var(--cw); height:var(--ch); perspective:1000px; cursor:pointer; transition:transform .35s ease, opacity .35s ease, filter .35s ease; opacity:.58; filter:brightness(.7); }
.card.is-center { transform:scale(1.08); opacity:1; filter:brightness(1); }
.card-inner { width:100%; height:100%; transform-style:preserve-3d; transition:transform .65s cubic-bezier(.22,.8,.22,1); }
.card.flipped .card-inner { transform:rotateY(180deg); }
.card-face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:10px; overflow:hidden; border:1px solid rgba(232,201,106,.38); background:linear-gradient(180deg,#0F2244 0%,#060C1A 100%); box-shadow:0 0 0 1px rgba(255,255,255,.05),0 20px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(232,201,106,.15); }
.card-face::before { content:''; position:absolute; inset:8px; border:1px solid rgba(232,201,106,.12); border-radius:7px; pointer-events:none; z-index:1; }
.card-face::after { content:''; position:absolute; top:0; left:15%; right:15%; height:2px; background:linear-gradient(90deg,transparent,var(--gold-light),transparent); border-radius:999px; }
.card.is-center .card-face { border-color:rgba(232,201,106,.65); box-shadow:0 0 0 1px rgba(232,201,106,.18),0 0 30px rgba(232,201,106,.15),0 24px 60px rgba(0,0,0,.6); }

/* FRONT */
.card-front { display:flex; flex-direction:column; }
.card-photo { flex:1; min-height:0; display:flex; align-items:flex-end; justify-content:center; background:radial-gradient(circle at 50% 20%,rgba(232,201,106,.18) 0%,transparent 60%); overflow:hidden; }
.card-photo img { width:100%; height:100%; object-fit:cover; object-position:top center; }
.card-photo.empty { align-items:center; justify-content:center; background:radial-gradient(circle at 50% 50%,rgba(232,201,106,.06) 0%,transparent 70%); }
.ghost-icon { opacity:.18; }
.ghost-icon svg { width:72px; height:72px; }
.card-nameplate { padding:12px 16px 14px; background:linear-gradient(0deg,rgba(4,8,16,.95) 0%,rgba(6,12,26,.8) 100%); border-top:1px solid rgba(232,201,106,.2); position:relative; z-index:2; }
.card-role { font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold-light); margin-bottom:3px; }
.card-name { font-family:'Playfair Display',serif; font-size:18px; line-height:1.15; font-weight:600; }
.card-name.ghost { color:rgba(255,255,255,.3); font-style:italic; }

/* tap hint — only shows on center, un-flipped */
.tap-hint { position:absolute; bottom:68px; right:10px; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:rgba(232,201,106,0); display:flex; align-items:center; gap:4px; z-index:3; pointer-events:none; transition:color .3s; }
.card.is-center:not(.flipped) .tap-hint { color:rgba(232,201,106,.6); }
.tap-hint svg { width:12px; height:12px; }

/* BACK */
.card-back { transform:rotateY(180deg); display:flex; flex-direction:column; padding:18px 16px 16px; gap:10px; }
.back-name { font-family:'Playfair Display',serif; font-size:17px; color:var(--gold-light); font-weight:600; border-bottom:1px solid rgba(232,201,106,.2); padding-bottom:8px; }
.back-bio { font-size:11px; color:rgba(255,255,255,.6); line-height:1.5; }
.attrs { display:flex; flex-direction:column; gap:7px; flex:1; }
.attr-row { display:flex; flex-direction:column; gap:3px; }
.attr-label { display:flex; justify-content:space-between; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.65); }
.attr-label b { color:var(--gold-light); }
.attr-bar { height:5px; border-radius:999px; background:rgba(255,255,255,.1); overflow:hidden; }
.attr-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--gold),var(--gold-light)); transform-origin:left; transform:scaleX(0); transition:transform .7s cubic-bezier(.22,.8,.22,1) .1s; }
.card.flipped .attr-fill { transform:scaleX(1); }
.coming-soon-back { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:14px; padding:24px; text-align:center; }
.coming-soon-back svg { width:40px; height:40px; opacity:.2; }
.coming-soon-back p { font-size:12px; color:rgba(255,255,255,.35); line-height:1.5; }
.wa-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:10px 12px; border-radius:6px; background:linear-gradient(135deg,#25D366,#1DA851); color:#fff; font-size:12px; font-weight:600; letter-spacing:.06em; text-decoration:none; margin-top:auto; flex-shrink:0; transition:filter .2s,transform .15s; font-family:'DM Sans',sans-serif; }
.wa-btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
.wa-btn svg { width:16px; height:16px; flex-shrink:0; }

/* DOTS */
.dots { display:flex; justify-content:center; gap:6px; padding:10px 0 6px; flex-shrink:0; }
.dot { width:5px; height:5px; border-radius:999px; background:rgba(255,255,255,.2); transition:background .3s,width .3s; cursor:pointer; }
.dot.active { background:var(--gold-light); width:18px; }

.hint-strip { text-align:center; font-size:11.5px; color:rgba(255,255,255,.28); padding:4px 5% 14px; flex-shrink:0; letter-spacing:.05em; }

@media (max-width:680px) {
  html,body { overflow:auto; }
  .page { height:auto; min-height:100vh; }
  .stage { min-height:460px; }
  :root { --cw:200px; --ch:320px; }
  .hero h1 { font-size:28px; }
}
</style>

<body>
<div class="page">

  <div class="topbar">
    <a class="logo-link" href="../index.html">
      <img src="../assets/logo_casb.png" alt="CASB">
      <span class="logo-label">Mentor Selection</span>
    </a>
    <a class="back-link" href="../index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back
    </a>
  </div>

  <div class="hero">
    <div class="kicker">Choose Your Path</div>
    <h1>Select Your Mentor</h1>
    <p>Tap a card to select. Tap again to reveal their profile.</p>
  </div>

  <div class="stage">
    <div class="spotlight"></div>
    <button class="arrow arrow-left"  id="arrowL" aria-label="Previous">&#8249;</button>
    <div class="carousel-wrap" id="wrap">
      <div class="carousel-belt" id="belt"></div>
    </div>
    <button class="arrow arrow-right" id="arrowR" aria-label="Next">&#8250;</button>
  </div>

  <div class="dots" id="dots"></div>
  <div class="hint-strip">Tap to select &nbsp;·&nbsp; Tap again to flip &nbsp;·&nbsp; Drag &amp; fling to browse</div>
</div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────
const WA_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.09.543 4.058 1.494 5.771L.044 23.956l6.335-1.44A11.945 11.945 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.898 0-3.68-.51-5.215-1.397l-.374-.22-3.759.855.882-3.665-.244-.382A9.95 9.95 0 0 1 2 12c0-5.514 4.486-10 10-10s10 4.486 10 10-4.486 10-10 10z"/></svg>`;
const GHOST  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2a7 7 0 0 1 7 7v7l2 2H3l2-2V9a7 7 0 0 1 7-7z"/><path d="M9 21a3 3 0 0 0 6 0"/></svg>`;
const TAP_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v5h5M20 20v-5h-5M4 9a8 8 0 0 1 13.9-2.9M20 15a8 8 0 0 1-13.9 2.9"/></svg>`;

const MENTORS = [
  { name:"Vincent Yang",   role:"Strategy Builder",    photo:"../assets/photos/team/Vincent%20Yang.jpg",                    bio:"Structured growth, business discipline, and agency leadership direction.",              attrs:[["Leadership",95],["Systems",92],["Growth",90]],    wa:"60XXXXXXXXX", waName:"Vincent" },
  { name:"Asher Chong",    role:"Momentum Coach",      photo:"../assets/photos/team/Asher%20Chong_1.jpg",                  bio:"Energy, practical field guidance, and a confident first step into the industry.",      attrs:[["Field Skill",91],["Momentum",94],["Confidence",88]], wa:"60XXXXXXXXX", waName:"Asher" },
  { name:"Alice Chong",    role:"Trust Builder",       photo:"../assets/photos/team/Alice_Chong%20Poh%20Chiang.jpg",       bio:"Long-term client relationships, care-led planning, and steady sustainable habits.",      attrs:[["Care",96],["Planning",89],["Trust",93]],           wa:"60XXXXXXXXX", waName:"Alice" },
  { name:"William Choong", role:"Performance Guide",   photo:"../assets/photos/team/William_Choong%20Kei%20Foong.jpg",     bio:"Measurable targets, consistency, and turning daily activity into real results.",        attrs:[["Targets",93],["Discipline",90],["Results",92]],    wa:"60XXXXXXXXX", waName:"William" },
  { name:"Anna Chow",      role:"Culture Mentor",      photo:"../assets/photos/team/Anna_Chow%20Mei%20Ying.jpg",           bio:"Encouragement, team connection, and a genuinely supportive learning environment.",      attrs:[["Teamwork",94],["Support",95],["Learning",88]],     wa:"60XXXXXXXXX", waName:"Anna" },
  { name:"Steve Moh",      role:"Conversation Coach",  photo:"../assets/photos/team/Steve_Moh%20Hiong%20Ie.jpg",           bio:"Client conversations, presentation flow, and building real advisory confidence.",       attrs:[["Speaking",91],["Advisory",89],["Presence",90]],    wa:"60XXXXXXXXX", waName:"Steve" },
  { placeholder:true },
  { placeholder:true },
];
const N = MENTORS.length;

// ── CARD BUILDER ─────────────────────────────────────────────────────
function makeCard(m) {
  const el = document.createElement('div');
  el.className = 'card';
  if (m.placeholder) {
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-front">
          <div class="card-photo empty"><div class="ghost-icon">${GHOST}</div></div>
          <div class="card-nameplate"><div class="card-role">Coming Soon</div><div class="card-name ghost">Future Mentor</div></div>
        </div>
        <div class="card-face card-back">
          <div class="coming-soon-back">${GHOST}<p>This mentor spot is reserved.<br>Stay tuned for the next addition to the CASB roster.</p></div>
        </div>
      </div>`;
  } else {
    const attrs = m.attrs.map(([l,s]) => `
      <div class="attr-row">
        <div class="attr-label"><span>${l}</span><b>${s}</b></div>
        <div class="attr-bar"><div class="attr-fill"></div></div>
      </div>`).join('');
    const msg = encodeURIComponent(`Hi ${m.waName}, I'd like to join under your mentorship!`);
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-front">
          <div class="card-photo"><img src="${m.photo}" alt="${m.name}" loading="lazy"></div>
          <div class="tap-hint">${TAP_ICON}Flip</div>
          <div class="card-nameplate"><div class="card-role">${m.role}</div><div class="card-name">${m.name}</div></div>
        </div>
        <div class="card-face card-back">
          <div class="back-name">${m.name}</div>
          <div class="back-bio">${m.bio}</div>
          <div class="attrs">${attrs}</div>
          <a class="wa-btn" href="https://wa.me/${m.wa}?text=${msg}" target="_blank" rel="noopener">${WA_SVG} Choose ${m.waName}</a>
        </div>
      </div>`;
  }
  return el;
}

// ── PHYSICS ENGINE ───────────────────────────────────────────────────
// Pure JS momentum scroll — no native scroll involved.
// Position = offset of belt's left edge from wrap center.
// centerOf(index) = the X that puts card[index] in the middle.

const wrap  = document.getElementById('wrap');
const belt  = document.getElementById('belt');
const dotsEl= document.getElementById('dots');

// Build enough DOM cards: 3 full loops so we never run out
const COPIES = 3;
const domCards = [];
for (let c = 0; c < COPIES; c++) {
  MENTORS.forEach((m, i) => {
    const el = makeCard(m);
    el.dataset.real = i;
    el.dataset.copy = c;
    belt.appendChild(el);
    domCards.push(el);
  });
}
const TOTAL_CARDS = domCards.length; // N * COPIES

// dots
MENTORS.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot';
  d.addEventListener('click', () => snapTo(i + N, true)); // middle copy
  dotsEl.appendChild(d);
});

function stride() {
  const s = getComputedStyle(document.documentElement);
  return (parseFloat(s.getPropertyValue('--cw')) || 230) + (parseFloat(s.getPropertyValue('--gap')) || 24);
}

// absolute index of the center card (0 … TOTAL_CARDS-1)
// start at middle copy, card 0
let centerAbs = N; // middle copy starts at index N

// current belt X position (px, can be any float)
let beltX = 0;
let velX  = 0;       // px/frame velocity
let rafId = null;
let isAnimating = false;

function cardCenterX(absIdx) {
  // X that centers card absIdx in the wrap
  const wW = wrap.clientWidth;
  const st = stride();
  const cW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw')) || 230;
  // belt starts with left padding = wW/2 - cW/2 so card 0 is centered at beltX=0
  return -(absIdx * st);
}

function setBelt(x, instant) {
  beltX = x;
  belt.style.transition = instant ? 'none' : '';
  belt.style.left = (wrap.clientWidth / 2 - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw')) || 230) / 2) + 'px';
  belt.style.transform = `translateX(${x}px) translateY(-50%)`;
}

function updateCenter() {
  // figure out which absIdx is closest to center
  const st = stride();
  const closest = Math.round(-beltX / st);
  const clamped = Math.max(0, Math.min(TOTAL_CARDS - 1, closest));
  centerAbs = clamped;

  domCards.forEach((el, i) => el.classList.toggle('is-center', i === centerAbs));

  const realIdx = parseInt(domCards[centerAbs]?.dataset.real ?? 0);
  Array.from(dotsEl.children).forEach((d, i) => d.classList.toggle('active', i === realIdx));
}

// ── LOOP WRAP ─────────────────────────────────────────────────────────
// When the user drifts into the first or last copy, silently jump to middle copy
function loopCheck() {
  const st = stride();
  if (centerAbs < N * 0.5) {
    // too far left — jump right by one full set
    beltX -= N * st;
    centerAbs += N;
    setBelt(beltX, true);
  } else if (centerAbs > N * 1.5) {
    // too far right — jump left by one full set
    beltX += N * st;
    centerAbs -= N;
    setBelt(beltX, true);
  }
}

// ── SNAP TO CARD ──────────────────────────────────────────────────────
function snapTo(absIdx, animated) {
  stopPhysics();
  centerAbs = absIdx;
  const target = cardCenterX(absIdx);

  if (animated) {
    isAnimating = true;
    const start  = beltX;
    const dist   = target - start;
    const dur    = Math.min(420, 180 + Math.abs(dist) * 0.3);
    const t0     = performance.now();
    function ease(t) { return t < .5 ? 2*t*t : -1+(4-2*t)*t; } // easeInOut

    function step(now) {
      const p = Math.min(1, (now - t0) / dur);
      setBelt(start + dist * ease(p), true);
      updateCenter();
      if (p < 1) { rafId = requestAnimationFrame(step); }
      else { isAnimating = false; loopCheck(); updateCenter(); }
    }
    rafId = requestAnimationFrame(step);
  } else {
    setBelt(target, true);
    updateCenter();
    loopCheck();
  }
}

function snapToNearest(animated) {
  const st   = stride();
  const near = Math.round(-beltX / st);
  snapTo(Math.max(0, Math.min(TOTAL_CARDS - 1, near)), animated);
}

// ── PHYSICS FLING ─────────────────────────────────────────────────────
const FRICTION = 0.93;   // velocity multiplier per frame
const MIN_VEL  = 0.3;    // px/frame below which we snap

function stopPhysics() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  isAnimating = false;
  velX = 0;
}

function runPhysics() {
  if (Math.abs(velX) < MIN_VEL) {
    velX = 0;
    snapToNearest(true);
    return;
  }
  velX *= FRICTION;
  beltX += velX;
  setBelt(beltX, true);
  updateCenter();
  loopCheck();
  rafId = requestAnimationFrame(runPhysics);
}

// ── POINTER / TOUCH INPUT ─────────────────────────────────────────────
let dragStartX   = 0;
let dragStartBeltX = 0;
let lastDragX    = 0;
let lastDragT    = 0;
let isDragging   = false;
let dragMoved    = false;  // true if pointer moved >4px (not a tap)

function onDragStart(clientX) {
  stopPhysics();
  isDragging    = true;
  dragMoved     = false;
  dragStartX    = clientX;
  dragStartBeltX = beltX;
  lastDragX     = clientX;
  lastDragT     = performance.now();
}

function onDragMove(clientX) {
  if (!isDragging) return;
  const dx = clientX - dragStartX;
  if (Math.abs(dx) > 4) dragMoved = true;
  if (!dragMoved) return;
  setBelt(dragStartBeltX + dx, true);
  // track velocity
  const now = performance.now();
  const dt  = now - lastDragT;
  if (dt > 0) velX = (clientX - lastDragX) / dt * 16; // normalise to ~60fps frame
  lastDragX = clientX;
  lastDragT = now;
  updateCenter();
}

function onDragEnd(clientX) {
  if (!isDragging) return;
  isDragging = false;
  if (!dragMoved) return; // was a tap — handled by click
  // fling if fast enough, else snap
  if (Math.abs(velX) > 1.5) {
    rafId = requestAnimationFrame(runPhysics);
  } else {
    snapToNearest(true);
  }
}

// mouse
wrap.addEventListener('mousedown',  e => { e.preventDefault(); onDragStart(e.clientX); });
window.addEventListener('mousemove',e => onDragMove(e.clientX));
window.addEventListener('mouseup',  e => onDragEnd(e.clientX));

// touch
wrap.addEventListener('touchstart', e => {
  // if already moving (fling), stop immediately on touch
  if (Math.abs(velX) > 0.5 || isAnimating) {
    stopPhysics();
    return; // don't start new drag — first touch just stops
  }
  onDragStart(e.touches[0].clientX);
}, { passive: true });

wrap.addEventListener('touchmove',  e => onDragMove(e.touches[0].clientX), { passive: true });
wrap.addEventListener('touchend',   e => onDragEnd(e.changedTouches[0].clientX), { passive: true });

// ── CLICK / TAP LOGIC ────────────────────────────────────────────────
// Tap on non-center card  →  snap that card to center
// Tap on center card      →  flip it
// Never flip if tap was actually a drag

wrap.addEventListener('click', e => {
  if (dragMoved) return; // was a drag, not a tap
  if (e.target.closest('a')) return;
  const card = e.target.closest('.card');
  if (!card) return;

  const absIdx = domCards.indexOf(card);
  if (absIdx === -1) return;

  if (card.classList.contains('is-center')) {
    // already center — flip
    card.classList.toggle('flipped');
  } else {
    // bring to center, un-flip current center first
    domCards.forEach(c => c.classList.remove('flipped'));
    snapTo(absIdx, true);
  }
});

// ── ARROWS ───────────────────────────────────────────────────────────
document.getElementById('arrowL').addEventListener('click', () => {
  domCards.forEach(c => c.classList.remove('flipped'));
  snapTo(centerAbs - 1, true);
});
document.getElementById('arrowR').addEventListener('click', () => {
  domCards.forEach(c => c.classList.remove('flipped'));
  snapTo(centerAbs + 1, true);
});

// ── KEYBOARD ─────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  { domCards.forEach(c=>c.classList.remove('flipped')); snapTo(centerAbs-1,true); }
  if (e.key === 'ArrowRight') { domCards.forEach(c=>c.classList.remove('flipped')); snapTo(centerAbs+1,true); }
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    const center = domCards[centerAbs];
    if (center) center.classList.toggle('flipped');
  }
});

// ── INIT ─────────────────────────────────────────────────────────────
function init() {
  setBelt(cardCenterX(centerAbs), true);
  updateCenter();
}
if (document.readyState === 'complete') init();
else window.addEventListener('load', init);
window.addEventListener('resize', () => { setBelt(cardCenterX(centerAbs), true); });
</script>
</body>
