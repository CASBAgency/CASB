<section class="event-gallery-page">

      </div>
      <div class="event-cover-count" data-cover-count>1 / 9</div>
    </div>
    <div class="event-gallery-intro">
      <div class="section-tag">Charity Day</div>
      <h1>Allianz Charity Day</h1>
      <div class="gold-line" style="margin-left:auto;margin-right:auto"></div>
      <p>Community moments and CASB team participation highlights from Allianz Charity Day 2022.</p>
      <div class="event-tags"><span>Charity</span><span>Community</span><span>Team</span></div>
      <p class="event-photo-count">9 photos</p>
    </div>
  </div>

    <div class="event-gallery-head">

      <p>Scroll through the full event gallery. Tap or click any photo to view it larger and save it.</p>
    </div>
    <div class="event-gallery-loop" data-gallery-loop>
      <div class="event-gallery-track">
          <button class="event-gallery-item" type="button" data-full="../assets/photos/events/allianz-charity-day-2022/gallery/photo-001.jpg" data-caption="Allianz Charity Day photo 1">

  <button class="gallery-top-button" type="button" data-gallery-top aria-label="Return to top">&#8593;</button>
</section>
<div class="event-lightbox" data-event-lightbox aria-hidden="true">
  <div class="event-lightbox-inner" role="dialog" aria-modal="true" aria-label="Event photo viewer">
    <button class="event-lightbox-close" type="button" data-lightbox-close aria-label="Close photo">Close</button>
    <img data-lightbox-image src="" alt="">
    <div class="event-lightbox-caption" data-lightbox-caption></div>
    <div class="event-lightbox-actions">
      <a href="#" data-lightbox-download download>Save photo</a>
    </div>
  </div>
</div>
<script src="event-gallery.js"></script>
